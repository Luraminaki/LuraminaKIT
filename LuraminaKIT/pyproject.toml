[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "LuraminaKIT"
version = "0.1.0"
description = "Discord bot that discovers and proxies commands to modulesKIT modules"
requires-python = ">=3.12"
dependencies = [
    "discord.py",
    "aiohttp",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "langchain-text-splitters",
    "psutil",
    # PyPI package is 'nvidia-ml-py' (the actively-maintained, official Nvidia one)
    # but it's imported as `pynvml` -- used for `/status`'s GPU readings, and safe
    # to install even without an Nvidia card present: `nvmlInit()` just fails
    # gracefully at runtime instead (see `modules.helpers.host_metrics`).
    "nvidia-ml-py",
    # PyPI package is 'py-cpuinfo' but it's imported as `cpuinfo` -- used for
    # `/status`'s CPU brand string (its own cross-platform detection is far less
    # code than hand-rolling a Windows registry read + /proc/cpuinfo parse + a
    # macOS sysctl call ourselves).
    "py-cpuinfo",
    # 'contractsKIT' is a sibling project in this monorepo, not a portable PEP 621
    # dependency -- install it editable alongside this package instead.
]

# Optional dependency for a future voice/music module. Pulls in PyNaCl (voice
# encryption) via discord.py's own [voice] extra -- without it, discord.py logs
# "voice will NOT be supported" and voice connections fail. `ffmpeg` must also be
# present on the system PATH for actual audio playback; that's not pip-installable.
# Install with `pip install -e .[voice]` once a voice module exists.
[project.optional-dependencies]
voice = [
    "discord.py[voice]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
LuraminaKIT = ["py.typed"]
