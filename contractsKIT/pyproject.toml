[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contractsKIT"
version = "0.1.0"
description = "Shared pydantic contracts between modulesKIT and LuraminaKIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contractsKIT = ["py.typed"]
